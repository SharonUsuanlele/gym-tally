<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Gym Tally</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--bg:#000;--card:#0b0b0b;--line:#1c1c1c;--line2:#2a2a2a;--text:#f5f5f5;--muted:#7a7a7a;--accent:#fff;--bad:#ff5a5a;--ok:#5ad38c;--warn:#e8b44a}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 "Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  body{padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom))}
  main{max-width:520px;margin:0 auto;padding:28px 20px}
  h1{font-size:30px;font-weight:700;margin:4px 0 6px;letter-spacing:-.03em}
  h2{font-size:12px;font-weight:600;margin:32px 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
  p{margin:6px 0}
  a{color:var(--text);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line2)}
  b{font-weight:600}
  .muted{color:var(--muted);font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:12px 0}
  .card > b:first-child{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-bottom:6px}
  label{display:block;font-size:12px;color:var(--muted);margin:16px 0 6px;text-transform:uppercase;letter-spacing:.1em}
  input[type=text],input[type=email],input[type=password]{width:100%;padding:13px 14px;border-radius:10px;border:1px solid var(--line2);background:#000;color:var(--text);font-size:16px;outline:none}
  input:focus{border-color:#555}
  button{font:inherit;border:0;border-radius:10px;padding:13px 16px;cursor:pointer;font-weight:600;transition:opacity .15s,background .15s}
  button:active{opacity:.7}
  .btn{background:#fff;color:#000;width:100%;margin-top:14px}
  .btn.big{padding:18px;font-size:17px;border-radius:12px}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line2);font-weight:500}
  .btn:disabled{opacity:.4}
  .link{background:none;color:var(--text);padding:6px 0;font-weight:500;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line2)}
  .days{display:flex;gap:5px}
  .day{flex:1;min-width:0;text-align:center;padding:10px 0;border-radius:8px;border:1px solid var(--line2);background:transparent;color:var(--muted);font-weight:500;font-size:13px}
  .day.on{background:#fff;color:#000;border-color:#fff;font-weight:600}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0}
  .pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
  .pill.ok{color:var(--ok)} .pill.bad{color:var(--bad)} .pill.wait{color:var(--warn)}
  .big-num{font-family:"Geist Mono",ui-monospace,monospace;font-size:30px;font-weight:700;letter-spacing:-.03em;margin:8px 0 2px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:14px;text-align:left;border-top:1px solid var(--line)}
  .stats div{padding:12px 0 2px}
  .stats b{display:block;font-family:"Geist Mono",ui-monospace,monospace;font-size:19px;font-weight:600;letter-spacing:-.02em}
  .stats span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .strip{display:flex;gap:3px;flex-wrap:wrap;margin-top:14px}
  .strip i{width:12px;height:12px;border-radius:3px;background:#161616;display:inline-block}
  .strip i.h{background:#fff} .strip i.m{background:var(--bad)} .strip i.p{background:transparent;box-shadow:inset 0 0 0 1.5px var(--warn)}
  .lead{border-color:#fff}
  nav{position:fixed;left:0;right:0;bottom:0;background:rgba(0,0,0,.92);border-top:1px solid var(--line);display:flex;padding:4px 8px calc(4px + env(safe-area-inset-bottom));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  nav button{flex:1;background:none;color:var(--muted);padding:14px 0;font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;border-radius:0;position:relative}
  nav button.on{color:#fff}
  nav button.on::after{content:"";position:absolute;left:50%;bottom:6px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#fff}
  .cam{position:fixed;inset:0;background:#000;z-index:20;display:flex;flex-direction:column}
  .cam video,.cam img{flex:1;width:100%;object-fit:cover;min-height:0}
  .cam .bar{display:flex;gap:10px;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:#000}
  .cam .bar button{flex:1;margin:0}
  .shutter{background:#fff;color:#000}
  .feed img:not(.av){width:100%;border-radius:10px;display:block;margin-top:12px;aspect-ratio:3/4;object-fit:cover;background:#111}
  .toast{position:fixed;left:20px;right:20px;bottom:84px;max-width:480px;margin:0 auto;background:#fff;color:#000;padding:13px 16px;border-radius:10px;font-weight:500;font-size:14px;z-index:30}
  .av{width:32px;height:32px;border-radius:50%;object-fit:cover;background:#1a1a1a;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#aaa;flex:none;vertical-align:middle;border:1px solid var(--line2)}
  .av.lg{width:72px;height:72px;font-size:26px}
  .who{display:flex;align-items:center;gap:10px}
  .hidden{display:none!important}
  .center{text-align:center}
</style>
</head>
<body>
<main id="app"><p class="muted">Loading…</p></main>
<nav id="nav" class="hidden">
  <button data-tab="today">Today</button>
  <button data-tab="board">Board</button>
  <button data-tab="feed">Feed</button>
  <button data-tab="me">Me</button>
</nav>

<script>
/* ===== CONFIG ===== */
const SUPABASE_URL = "https://uvtvdkrxyctbzqzndbaw.supabase.co";
const SUPABASE_KEY = "sb_publishable_NteYl5iwu05kpbvx4vPg9Q_S3rb5Wh4";
const FINE = 5;            // £ per missed day
const MIN_DAYS = 3;        // minimum committed days per week
const SEASON_START = "2026-12-01";   // first day that counts
const SEASON_END = "2027-05-31";     // last day that counts
const DAY_NAMES = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DAY_ORDER = [1,2,3,4,5,6,0];

/* ===== SCORING (pure, no DOM) ===== */
const londonDate = (d = new Date()) =>
  new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/London", year:"numeric", month:"2-digit", day:"2-digit" }).format(d);
const dow = (s) => new Date(s + "T12:00:00Z").getUTCDay();
const addDays = (s, n) => { const d = new Date(s + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0,10); };
const monthKey = (s) => s.slice(0,7);
const monthStart = (k) => k + "-01";
const monthEnd = (k) => { const [y,m] = k.split("-").map(Number); return new Date(Date.UTC(y, m, 0, 12)).toISOString().slice(0,10); };
const nextMonth = (k) => { const [y,m] = k.split("-").map(Number); return m === 12 ? `${y+1}-01` : `${y}-${String(m+1).padStart(2,"0")}`; };
const weekStart = (s) => addDays(s, -((dow(s) + 6) % 7));
const daysFor = (p, d, plans) => (plans && plans[p.id + "|" + weekStart(d)]) || p.days;
const monthLabel = (k) => new Date(k + "-15T12:00:00Z").toLocaleDateString("en-GB", { month:"long", year:"numeric", timeZone:"UTC" });

const counts = (c) => c.review === "approved" || (c.valid && c.review !== "rejected");
function scoreMonth(profiles, checkins, key, today, plans) {
  const valid = new Set(checkins.filter(counts).map(c => c.user_id + "|" + c.local_date));
  const rows = profiles.map(p => {
    const from = [p.start_date, monthStart(key), SEASON_START].sort().pop();
    const to = [monthEnd(key), today, SEASON_END].sort()[0];
    const days = []; let hits = 0, misses = 0, pending = 0;
    for (let d = monthStart(key); d <= monthEnd(key); d = addDays(d, 1)) {
      let s = "x";
      if (d >= from && d <= to && daysFor(p, d, plans).includes(dow(d))) {
        if (valid.has(p.id + "|" + d)) { s = "h"; hits++; }
        else if (d < today) { s = "m"; misses++; }
        else { s = "p"; pending++; }
      } else if (d >= from && d <= to && valid.has(p.id + "|" + d)) s = "h";
      days.push({ d, s });
    }
    let sessions = 0;
    for (const v of valid) { const [u, d] = v.split("|"); if (u === p.id && monthKey(d) === key && d >= from && d <= to) sessions++; }
    const committed = hits + misses;
    return { id: p.id, name: p.name, hits, misses, pending, committed, sessions, owed: misses * FINE,
             rate: committed ? hits / committed : 1, days };
  });
  return rows;
}

function pickWinner(rows) {
  if (!rows.length) return null;
  const sorted = [...rows].sort((a, b) => a.misses - b.misses || b.sessions - a.sessions);
  const top = sorted[0], second = sorted[1];
  if (second && second.misses === top.misses && second.sessions === top.sessions) return null;
  return top;
}

/* Runs every month from the first start date to the current one, carrying unpaid fines through rollovers. */
function computeSeason(profiles, checkins, today, plans) {
  if (!profiles.length) return { months: [], current: null };
  const first = [profiles.map(p => p.start_date).sort()[0], SEASON_START].sort().pop();
  const realNow = monthKey(today);
  const nowKey = realNow < monthKey(SEASON_START) ? monthKey(SEASON_START) : (realNow > monthKey(SEASON_END) ? monthKey(SEASON_END) : realNow);
  const carry = {}; profiles.forEach(p => carry[p.id] = 0);
  const months = [];
  for (let k = monthKey(first); k <= nowKey; k = nextMonth(k)) {
    const active = profiles.filter(p => p.start_date <= monthEnd(k));
    const rows = scoreMonth(active, checkins, k, today, plans)
      .sort((a, b) => a.misses - b.misses || b.sessions - a.sessions || a.name.localeCompare(b.name));
    rows.forEach(r => { r.carried = carry[r.id] || 0; r.totalOwed = r.carried + r.owed; });
    const pot = rows.reduce((s, r) => s + r.totalOwed, 0);
    const finished = k < realNow;
    const winner = pickWinner(rows);
    const m = { key: k, rows, pot, finished, winner, payments: [], rolledOver: false };
    if (finished) {
      if (winner) {
        m.payments = rows.filter(r => r.id !== winner.id && r.totalOwed > 0).map(r => ({ from: r.name, to: winner.name, amount: r.totalOwed }));
        profiles.forEach(p => carry[p.id] = 0);
      } else {
        m.rolledOver = true;
        rows.forEach(r => carry[r.id] = r.totalOwed);
      }
    }
    months.push(m);
  }
  return { months, current: months[months.length - 1] };
}
/* ===== END SCORING ===== */

/* ===== APP ===== */
const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
const $app = document.getElementById("app");
const $nav = document.getElementById("nav");
const S = { user: null, member: false, admin: false, profiles: [], checkins: [], plans: {}, me: null, tab: "today", urls: {} };

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const money = (n) => "£" + n.toFixed(n % 1 ? 2 : 0);
function toast(msg, ms = 3200) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }
const prettyDate = (d) => new Date(d + "T12:00:00Z").toLocaleDateString("en-GB", { weekday:"short", day:"numeric", month:"long", timeZone:"UTC" });
function seasonBanner(today) {
  if (today < SEASON_START) {
    const n = Math.round((new Date(SEASON_START + "T12:00:00Z") - new Date(today + "T12:00:00Z")) / 864e5);
    return `<div class="card"><b>Season starts</b><p class="big-num">${n} day${n === 1 ? "" : "s"}</p><p class="muted">${prettyDate(SEASON_START)}. Runs until ${prettyDate(SEASON_END)}. Practice check ins before then don't count, so use them to test the app.</p></div>`;
  }
  if (today > SEASON_END) return `<div class="card"><b>Season finished</b><p class="muted">It ran ${prettyDate(SEASON_START)} to ${prettyDate(SEASON_END)}. See the Board for final results.</p></div>`;
  return "";
}
const fmtTime = (iso) => new Date(iso).toLocaleString("en-GB", { timeZone:"Europe/London", weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" });

function getPosition() {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error("Location isn't available on this device."));
    navigator.geolocation.getCurrentPosition(res, (e) => rej(new Error(e.code === 1 ? "Location permission was blocked. Allow it in your browser settings." : "Couldn't get your location. Try again.")),
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  });
}

async function boot() {
  if (!sb) { $app.innerHTML = `<p>Couldn't load. Check your connection and refresh.</p>`; return; }
  const { data } = await sb.auth.getSession();
  S.user = data.session?.user || null;
  sb.auth.onAuthStateChange((_e, session) => {
    const was = S.user?.id; S.user = session?.user || null;
    if (was !== S.user?.id) load();
  });
  load();
}

async function load() {
  if (!S.user) { $nav.classList.add("hidden"); return renderAuth(); }
  const { data: isM } = await sb.rpc("is_member");
  S.member = !!isM;
  if (S.member) { const { data: isA } = await sb.rpc("is_admin"); S.admin = !!isA; }
  if (!S.member) { $nav.classList.add("hidden"); return renderNotMember(); }
  await refresh();
  if (!S.me) { $nav.classList.add("hidden"); return renderSetup(); }
  $nav.classList.remove("hidden");
  render();
}

async function refresh() {
  const [p, w, c] = await Promise.all([
    sb.from("profiles").select("*"),
    sb.from("week_plans").select("user_id,week_start,days"),
    sb.from("checkins").select("id,user_id,created_at,local_date,distance_m,valid,photo_path,lat,lng,review,review_note").order("created_at", { ascending: false }).limit(2000)
  ]);
  S.profiles = p.data || [];
  S.checkins = c.data || [];
  S.plans = Object.fromEntries((w.data || []).map(x => [x.user_id + "|" + x.week_start, x.days]));
  S.me = S.profiles.find(x => x.id === S.user.id) || null;
}

/* --- auth --- */
function renderAuth(mode = "login") {
  const signup = mode === "signup";
  $app.innerHTML = `
    <h1>Gym Tally</h1>
    <p class="muted">Private to the group. ${signup ? "Create your account with the email you gave the group admin." : "Log in to check in."}</p>
    <div class="card">
      <label>Email</label><input id="em" type="email" autocomplete="email" inputmode="email">
      <label>Password</label><input id="pw" type="password" autocomplete="${signup ? "new-password" : "current-password"}" placeholder="${signup ? "At least 8 characters" : ""}">
      <button class="btn" id="go">${signup ? "Create account" : "Log in"}</button>
      <p class="center"><button class="link" id="sw">${signup ? "Already have an account? Log in" : "First time? Create an account"}</button></p>
    </div>`;
  document.getElementById("sw").onclick = () => renderAuth(signup ? "login" : "signup");
  document.getElementById("go").onclick = async (e) => {
    const email = document.getElementById("em").value.trim(), password = document.getElementById("pw").value;
    if (!email || !password) return toast("Enter your email and password.");
    if (signup && password.length < 8) return toast("Use at least 8 characters.");
    e.target.disabled = true;
    const r = signup ? await sb.auth.signUp({ email, password }) : await sb.auth.signInWithPassword({ email, password });
    e.target.disabled = false;
    if (r.error) return toast(r.error.message);
    if (signup && !r.data.session) toast("Account made. If it asks you to confirm your email, tell the group admin.");
  };
}

function renderNotMember() {
  $app.innerHTML = `<h1>Not on the list</h1>
    <p class="muted">${esc(S.user.email)} isn't in this group. Ask the group admin to add this email, then refresh.</p>
    <button class="btn ghost" id="out">Log out</button>`;
  document.getElementById("out").onclick = () => sb.auth.signOut();
}

/* --- setup / profile --- */
function daysPicker(selected) {
  return `<div class="days">${DAY_ORDER.map(d => `<button type="button" class="day ${selected.includes(d) ? "on" : ""}" data-d="${d}">${DAY_NAMES[d]}</button>`).join("")}</div>`;
}
function wireDays(sel) {
  document.querySelectorAll(".day").forEach(b => b.onclick = () => {
    const d = +b.dataset.d; const i = sel.indexOf(d);
    i >= 0 ? sel.splice(i, 1) : sel.push(d); b.classList.toggle("on");
  });
}

const dayList = (arr) => DAY_ORDER.filter(d => arr.includes(d)).map(d => DAY_NAMES[d]).join(", ");
const weekLabel = (ws) => new Date(ws + "T12:00:00Z").toLocaleDateString("en-GB", { day:"numeric", month:"short", timeZone:"UTC" });

function renderSetup() {
  const sel = [];
  $app.innerHTML = `
    <h1>Set up</h1><p class="muted">Do this once. You can plan different days for each week later.</p>
    <div class="card">
      <label>Your name</label><input id="nm" type="text" maxlength="30">
      <label>Your default gym days (minimum ${MIN_DAYS} a week)</label>${daysPicker(sel)}
      <p class="muted">Used for any week you don't plan separately.</p>
      <p class="muted">You'll pin your gym from the Me tab the first time you're there.</p>
      <button class="btn" id="save">Save and start</button>
    </div>`;
  wireDays(sel);
  document.getElementById("save").onclick = async (e) => {
    const name = document.getElementById("nm").value.trim();
    if (!name) return toast("Add your name.");
    if (sel.length < MIN_DAYS) return toast(`Pick at least ${MIN_DAYS} days.`);
    e.target.disabled = true;
    const { error } = await sb.from("profiles").insert({ id: S.user.id, name, days: sel.sort() });
    e.target.disabled = false;
    if (error) return toast(error.message);
    load();
  };
}

/* --- main views --- */
function render() {
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === S.tab));
  ({ today: renderToday, board: renderBoard, feed: renderFeed, me: renderMe })[S.tab]();
  loadPhotos();
  window.scrollTo(0, 0);
}
$nav.onclick = (e) => { const t = e.target.closest("button")?.dataset.tab; if (t) { S.tab = t; render(); } };

function renderToday() {
  const today = londonDate(), me = S.me;
  const thisDays = daysFor(me, today, S.plans);
  const isDay = thisDays.includes(dow(today));
  const nextWs = addDays(weekStart(today), 7);
  const nextPlan = S.plans[me.id + "|" + nextWs];
  const mine = S.checkins.filter(c => c.user_id === me.id && c.local_date === today);
  const done = mine.some(counts);
  const season = computeSeason(S.profiles, S.checkins, today, S.plans);
  const myRow = season.current?.rows.find(r => r.id === me.id);
  const fixed = dayList(thisDays);
  $app.innerHTML = `
    <p class="muted">${new Date().toLocaleDateString("en-GB", { weekday:"long", day:"numeric", month:"long", timeZone:"Europe/London" })}</p>
    <div class="who" style="margin:4px 0 6px">${avatar(me, "lg")}<h1 style="margin:0">Hi ${esc(me.name)}</h1></div>
    ${seasonBanner(today)}
    <div class="card">
      ${done ? `<span class="pill ok">CHECKED IN</span><p class="big-num">Done today</p>`
        : isDay ? `<span class="pill wait">GYM DAY</span><p class="big-num">Get it done</p><p class="muted">${today < SEASON_START || today > SEASON_END ? "Outside the season, so this doesn't count." : `Check in by 11:59pm or it's a ${money(FINE)} miss.`}</p>`
        : `<span class="pill">Rest day</span><p class="big-num">Rest up</p><p class="muted">Extra sessions still count towards your total.</p>`}
      ${!me.gym_lat ? `<p class="muted" style="color:var(--warn)">Pin your gym first (do it while you're there), or check ins won't count.</p><button class="btn ghost" id="pin">Pin my gym</button>` : ""}
      ${done ? "" : `<button class="btn big" id="ci">Check in</button>`}
      ${mine.filter(c => !counts(c)).length ? `<p class="muted">You have ${mine.filter(c => !counts(c)).length} check in(s) today that didn't count. See the Feed for why.</p>` : ""}
    </div>
    ${myRow ? `<div class="card"><div class="row"><b>${monthLabel(season.current.key)}</b><span class="muted">${fixed}</span></div>
      <div class="stats"><div><b>${myRow.hits}/${myRow.committed + myRow.pending}</b><span>done</span></div><div><b>${myRow.misses}</b><span>misses</span></div><div><b>${myRow.sessions}</b><span>sessions</span></div><div><b>${money(myRow.totalOwed)}</b><span>owed</span></div></div>
      <div class="strip">${myRow.days.map(x => `<i class="${x.s}" title="${x.d}"></i>`).join("")}</div></div>` : ""}
    <div class="card"><div class="row"><div><b>Next week</b> <span class="muted">(from ${weekLabel(nextWs)})</span>
      <p class="muted">${dayList(nextPlan || me.days)}${nextPlan ? "" : " · your default"}</p></div>
      <button class="link" id="plan">Plan →</button></div>
      <p class="muted">Set it by Sunday night. Once the week starts, it's locked.</p></div>`;
  document.getElementById("plan").onclick = () => { S.tab = "me"; render(); setTimeout(() => document.getElementById("weeks")?.scrollIntoView({ behavior: "smooth" }), 50); };
  const ci = document.getElementById("ci"); if (ci) ci.onclick = () => openCamera();
  const pin = document.getElementById("pin"); if (pin) pin.onclick = () => { S.tab = "me"; render(); setTimeout(() => document.getElementById("mygym")?.scrollIntoView({ behavior: "smooth" }), 50); };
}

    <h1>${monthLabel(current.key)}</h1>
    ${seasonBanner(today)}
    <div class="card"><div class="row"><div><p class="muted">Pot so far</p><p class="big-num">${money(current.pot)}</p></div>
      <div style="text-align:right"><p class="muted">Leading</p><p><b>${leader ? esc(leader.name) : "Tied"}</b></p></div></div>
      <p class="muted">Fewest misses wins, then most sessions. A tie rolls the pot over.</p></div>
    ${current.rows.map((r, i) => `
      <div class="card ${leader && leader.id === r.id ? "lead" : ""}">
        <div class="row"><div class="who"><span class="muted" style="width:14px">${i + 1}</span>${avatar(profileOf(r.id))}<b>${esc(r.name)}</b></div>${r.pending ? `<span class="pill wait">due today</span>` : ""}</div>

          const recent = pr.gym_set_at && (Date.now() - new Date(pr.gym_set_at)) < 7 * 864e5 && pr.gym_set_at > pr.created_at && (Date.now() - new Date(pr.created_at)) > 864e5;
          return `<p class="muted">This week: ${dayList(daysFor(pr, today, S.plans))}</p>
          <p class="muted">${pr.gym_lat ? `${esc(pr.gym_name || "Gym")} · <a href="https://www.google.com/maps/search/?api=1&query=${pr.gym_lat},${pr.gym_lng}" target="_blank" rel="noopener">Map</a>` : "No gym set"}${recent ? ` <span class="pill wait">gym changed ${fmtTime(pr.gym_set_at)}</span>` : ""}</p>`; })()}
        <div class="stats"><div><b>${r.hits}/${r.committed}</b><span>hit</span></div><div><b>${r.misses}</b><span>misses</span></div><div><b>${r.sessions}</b><span>sessions</span></div><div><b>${money(r.totalOwed)}</b><span>owes${r.carried ? "*" : ""}</span></div></div>

      </div>`).join("")}` : ""}`;
}

function squareJpeg(file, size) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const m = Math.min(img.naturalWidth, img.naturalHeight), c = document.createElement("canvas");
      c.width = c.height = size;
      c.getContext("2d").drawImage(img, (img.naturalWidth - m) / 2, (img.naturalHeight - m) / 2, m, m, 0, 0, size, size);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error("Couldn't read that photo.")), "image/jpeg", 0.85);
    };
    img.onerror = () => rej(new Error("Couldn't read that photo."));
    img.src = url;
  });
}
function avatar(p, cls = "") {
  if (!p) return `<span class="av ${cls}">?</span>`;
  return p.avatar ? `<img class="av ${cls}" data-p="${esc(p.avatar)}" alt="">` : `<span class="av ${cls}">${esc((p.name || "?").trim().charAt(0).toUpperCase())}</span>`;
}
const profileOf = (id) => S.profiles.find(p => p.id === id);
async function loadPhotos() {
  const imgs = [...document.querySelectorAll("img[data-p]")];
  const need = [...new Set(imgs.map(i => i.dataset.p).filter(p => !S.urls[p]))];
  if (need.length) {
    const { data } = await sb.storage.from("checkins").createSignedUrls(need, 3600);
    (data || []).forEach(x => { if (x.signedUrl) S.urls[x.path] = x.signedUrl; });
  }
  imgs.forEach(img => { const u = S.urls[img.dataset.p]; if (u) img.src = u; });
}
async function renderFeed() {
  const names = Object.fromEntries(S.profiles.map(p => [p.id, p.name]));
  const items = S.checkins.slice(0, 30);
  $app.innerHTML = `<h1>Feed</h1>${items.length ? "" : `<p class="muted">No check ins yet.</p>`}<div class="feed">${items.map(c => `
    <div class="card"><div class="row"><div class="who">${avatar(profileOf(c.user_id))}<b>${esc(names[c.user_id] || "?")}</b></div>
      ${c.review === "rejected" ? `<span class="pill bad">REJECTED BY ADMIN</span>` : c.review === "approved" ? `<span class="pill ok">APPROVED BY ADMIN</span>`
        : c.valid ? `<span class="pill ok">COUNTED</span>` : `<span class="pill bad">DIDN'T COUNT</span>`}</div>
      ${c.review_note ? `<p class="muted">Admin note: ${esc(c.review_note)}</p>` : ""}
      <p class="muted">${fmtTime(c.created_at)} · ${c.distance_m != null ? `${c.distance_m}m from their gym` : "no gym pinned yet"} · <a href="https://www.google.com/maps/search/?api=1&query=${c.lat},${c.lng}" target="_blank" rel="noopener">Map</a></p>
      <img data-p="${esc(c.photo_path)}" alt="">
      ${S.admin ? `<div class="row" style="margin-top:10px">
        ${c.review !== "rejected" && counts(c) ? `<button class="btn ghost rv" data-id="${c.id}" data-r="rejected" style="margin:0;padding:10px">Reject as missed</button>` : ""}
        ${!counts(c) && c.review !== "approved" && c.review !== "rejected" ? `<button class="btn ghost rv" data-id="${c.id}" data-r="approved" style="margin:0;padding:10px">Approve anyway</button>` : ""}
        ${c.review ? `<button class="btn ghost rv" data-id="${c.id}" data-r="" style="margin:0;padding:10px">Undo</button>` : ""}
      </div>` : ""}
    </div>`).join("")}</div>`;
  document.querySelectorAll(".rv").forEach(b => b.onclick = async () => {
    const r = b.dataset.r || null;
    let note = null;
    if (r === "rejected") { note = prompt("Reason (optional, everyone sees it):", "Photo or location doesn't match"); if (note === null) return; }
    if (r === "approved") { note = prompt("Reason (optional, everyone sees it):", "GPS glitch, photo shows the gym"); if (note === null) return; }
    b.disabled = true;
    const { error } = await sb.rpc("review_checkin", { p_id: +b.dataset.id, p_review: r, p_note: note });
    if (error) { b.disabled = false; return toast(error.message); }
    await refresh(); toast(r === "rejected" ? "Rejected. It now counts as a missed day." : r === "approved" ? "Approved. It now counts." : "Undone."); render();
  });
  loadPhotos();
}

const mapUrl = (p) => `https://www.google.com/maps/search/?api=1&query=${p.gym_lat},${p.gym_lng}`;
function renderMe() {
  const me = S.me, sel = [...me.days];
  const others = S.profiles.filter(p => p.id !== me.id && p.gym_set_at);
  const today = londonDate(), ws0 = weekStart(today);
  const weeks = [1, 2, 3, 4].map(n => addDays(ws0, 7 * n));
  const wsel = Object.fromEntries(weeks.map(w => [w, [...(S.plans[me.id + "|" + w] || me.days)]]));
  $app.innerHTML = `
    <div class="who" style="margin:4px 0 4px">${avatar(me, "lg")}<div><h1 style="margin:0">${esc(me.name)}</h1><p class="muted" style="margin:0">${esc(S.user.email)}</p></div></div>
    <label class="btn ghost" style="display:block;text-align:center;text-transform:none;letter-spacing:0;font-size:15px;color:var(--text);margin:14px 0 0;padding:12px;border-radius:10px;cursor:pointer">${me.avatar ? "Change profile picture" : "Add profile picture"}<input type="file" id="avf" accept="image/*" class="hidden"></label>
    <div class="card" id="weeks"><b>Plan your weeks</b>
      <p class="muted">This week (from ${weekLabel(ws0)}): <b>${dayList(daysFor(me, today, S.plans))}</b> · locked</p>
      <p class="muted">Change upcoming weeks any time before they start (minimum ${MIN_DAYS} days).</p>
      ${weeks.map(w => `<div style="margin-top:14px"><div class="row"><span>Week of <b>${weekLabel(w)}</b></span>
        <span class="muted">${S.plans[me.id + "|" + w] ? "planned" : "default"}</span></div>
        <div class="days wk" data-w="${w}" style="margin-top:6px">${DAY_ORDER.map(d => `<button type="button" class="day ${wsel[w].includes(d) ? "on" : ""}" data-d="${d}">${DAY_NAMES[d]}</button>`).join("")}</div>
        <button class="btn ghost sw" data-w="${w}" style="margin-top:8px;padding:10px">Save week</button></div>`).join("")}
    </div>
    <div class="card"><b>Default days</b><p class="muted">Used for any week you haven't planned. Changing these applies from next week; past weeks stay as they were.</p>
      <div id="defdays">${daysPicker(sel)}</div><button class="btn ghost" id="sd">Save default days</button></div>
    <div class="card" id="mygym"><b>My gym</b>
      ${me.gym_lat ? `<p class="muted">${esc(me.gym_name || "My gym")} · pinned ${fmtTime(me.gym_set_at)} · <a href="${mapUrl(me)}" target="_blank" rel="noopener">Map</a></p>
        ${me.gym_photo ? `<div class="feed"><img data-p="${esc(me.gym_photo)}" alt=""></div>` : ""}` : `<p class="muted">Not pinned yet.</p>`}
      <label>Gym name</label><input id="gn" type="text" maxlength="40" value="${esc(me.gym_name || "")}" placeholder="e.g. PureGym Preston">
      <p class="muted">Stand inside your gym, tap below, and take a photo of the gym. Your pin and photo are shown to everyone.</p>
      <button class="btn" id="pingym">I'm at my gym: pin it with a photo</button></div>
    ${others.length ? `<div class="card"><b>Everyone's gym</b><p class="muted">Tap a map to check each pin is really a gym.</p>${others.map(p => `
      <div style="margin-top:14px"><b>${esc(p.name)}</b> <span class="muted">· ${esc(p.gym_name || "gym")} · pinned ${fmtTime(p.gym_set_at)} · <a href="${mapUrl(p)}" target="_blank" rel="noopener">Map</a></span>
      ${p.gym_photo ? `<div class="feed"><img data-p="${esc(p.gym_photo)}" alt=""></div>` : ""}</div>`).join("")}</div>` : ""}
    <button class="btn ghost" id="out">Log out</button>`;
  document.querySelectorAll("#defdays .day").forEach(b => b.onclick = () => {
    const d = +b.dataset.d, i = sel.indexOf(d); i >= 0 ? sel.splice(i, 1) : sel.push(d); b.classList.toggle("on"); });
  document.querySelectorAll(".wk .day").forEach(b => b.onclick = () => {
    const w = b.parentElement.dataset.w, arr = wsel[w], d = +b.dataset.d, i = arr.indexOf(d);
    i >= 0 ? arr.splice(i, 1) : arr.push(d); b.classList.toggle("on"); });
  document.querySelectorAll(".sw").forEach(b => b.onclick = async () => {
    const w = b.dataset.w, arr = wsel[w];
    if (arr.length < MIN_DAYS) return toast(`Pick at least ${MIN_DAYS} days.`);
    b.disabled = true;
    const { error } = await sb.from("week_plans").upsert({ user_id: me.id, week_start: w, days: [...arr].sort() });
    b.disabled = false;
    if (error) return toast(error.message.includes("row-level") ? "That week has already started, so it's locked." : error.message);
    await refresh(); toast(`Week of ${weekLabel(w)} saved.`); render();
  });
  document.getElementById("sd").onclick = async () => {
    if (sel.length < MIN_DAYS) return toast(`Pick at least ${MIN_DAYS} days.`);
    const { error } = await sb.from("profiles").update({ days: sel.sort() }).eq("id", me.id);
    if (error) return toast(error.message);
    await refresh(); toast("Default days saved."); render();
  };
  document.getElementById("avf").onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    try {
      toast("Uploading…", 1500);
      const blob = await squareJpeg(f, 400);
      const path = `${S.user.id}/avatar-${Date.now()}.jpg`;
      const up = await sb.storage.from("checkins").upload(path, blob, { contentType: "image/jpeg" });
      if (up.error) throw up.error;
      const { error } = await sb.from("profiles").update({ avatar: path }).eq("id", me.id);
      if (error) throw error;
      await refresh(); toast("Profile picture updated."); render();
    } catch (err) { toast(err.message || "Couldn't upload. Try another photo."); }
  };
  document.getElementById("pingym").onclick = () => {
    const gymName = document.getElementById("gn").value.trim().slice(0, 40) || null;
    openCamera({ label: "Pin as my gym", facing: "environment", onConfirm: async (blob, pos) => {
      if (pos.coords.accuracy > 100) throw new Error(`Location is too rough (±${Math.round(pos.coords.accuracy)}m). Move nearer a window and try again.`);
      const path = `${S.user.id}/gym-${Date.now()}.jpg`;
      const up = await sb.storage.from("checkins").upload(path, blob, { contentType: "image/jpeg" });
      if (up.error) throw up.error;
      const { error } = await sb.from("profiles").update({ gym_lat: pos.coords.latitude, gym_lng: pos.coords.longitude, gym_method: "here", gym_photo: path, gym_name: gymName }).eq("id", me.id);
      if (error) throw error;
      return "📍 Gym pinned.";
    } });
  };
  loadPhotos();
  document.getElementById("out").onclick = () => sb.auth.signOut();
}

/* --- live camera check in --- */
async function openCamera(opts = {}) {
  let stream = null, facing = opts.facing || "user", blob = null;
  const posP = getPosition();               // start GPS straight away
  posP.catch(() => {});
  const ov = document.createElement("div"); ov.className = "cam";
  ov.innerHTML = `<video autoplay playsinline muted></video><img class="hidden" alt="">
    <div class="bar" id="b1"><button class="btn ghost" id="x">Cancel</button><button class="btn ghost" id="fl">🔄</button><button class="btn shutter" id="sh">Take photo</button></div>
    <div class="bar hidden" id="b2"><button class="btn ghost" id="re">Retake</button><button class="btn" id="up">${opts.label || "Check in"}</button></div>`;
  document.body.appendChild(ov);
  const v = ov.querySelector("video"), im = ov.querySelector("img");
  const stop = () => stream && stream.getTracks().forEach(t => t.stop());
  const close = () => { stop(); ov.remove(); };
  async function start() {
    stop();
    try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1280 } }, audio: false }); v.srcObject = stream; }
    catch { close(); toast("Camera blocked. Allow camera access in your browser settings."); }
  }
  await start();
  ov.querySelector("#x").onclick = close;
  ov.querySelector("#fl").onclick = () => { facing = facing === "user" ? "environment" : "user"; start(); };
  ov.querySelector("#sh").onclick = () => {
    const w = v.videoWidth, h = v.videoHeight; if (!w) return;
    const scale = Math.min(1, 1080 / Math.max(w, h));
    const c = document.createElement("canvas"); c.width = Math.round(w * scale); c.height = Math.round(h * scale);
    const ctx = c.getContext("2d");
    if (facing === "user") { ctx.translate(c.width, 0); ctx.scale(-1, 1); }
    ctx.drawImage(v, 0, 0, c.width, c.height);
    c.toBlob(b => { blob = b; im.src = URL.createObjectURL(b); im.classList.remove("hidden"); v.classList.add("hidden");
      ov.querySelector("#b1").classList.add("hidden"); ov.querySelector("#b2").classList.remove("hidden"); }, "image/jpeg", 0.8);
  };
  ov.querySelector("#re").onclick = () => { blob = null; im.classList.add("hidden"); v.classList.remove("hidden");
    ov.querySelector("#b2").classList.add("hidden"); ov.querySelector("#b1").classList.remove("hidden"); };
  ov.querySelector("#up").onclick = async (e) => {
    e.target.disabled = true; e.target.textContent = "Checking location…";
    try {
      const pos = await posP.catch(() => getPosition());
      e.target.textContent = "Uploading…";
      if (opts.onConfirm) { const m = await opts.onConfirm(blob, pos); close(); await refresh(); render(); toast(m); return; }
      const path = `${S.user.id}/${Date.now()}.jpg`;
      const up = await sb.storage.from("checkins").upload(path, blob, { contentType: "image/jpeg" });
      if (up.error) throw up.error;
      const { data, error } = await sb.from("checkins").insert({ lat: pos.coords.latitude, lng: pos.coords.longitude,
        accuracy_m: Math.round(pos.coords.accuracy), photo_path: path }).select().single();
      if (error) throw error;
      close(); await refresh(); S.tab = "today"; render();
      if (data.valid) toast("✅ Checked in. Nice one!");
      else if (data.distance_m == null) toast("Saved, but it didn't count: set your gym location in Me first.", 5000);
      else toast(`Didn't count: you're ${data.distance_m}m from your gym (must be within 200m).`, 5000);
    } catch (err) { e.target.disabled = false; e.target.textContent = opts.label || "Check in"; toast(err.message || "Something went wrong. Try again."); }
  };
}

document.addEventListener("visibilitychange", async () => { if (!document.hidden && S.me) { await refresh(); render(); } });
boot();
